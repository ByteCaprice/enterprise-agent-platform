[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-platform"
version = "0.1.0"
description = "Enterprise AI control plane, capability registry, Prompt Bank, and governed execution platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "jsonschema>=4.18",
  "pydantic>=2",
  "pydantic-settings>=2.2",
  "psycopg2-binary>=2.9",
  "pyyaml>=6",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "uvicorn>=0.29",
  "PyJWT[crypto]>=2.10.1,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.8",
]
mcp = [
  "mcp>=1.19",
]

[project.scripts]
enterprise-ai = "interfaces.cli.platform:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["domain*", "interfaces*", "orchestration*", "framework*", "infra*", "capability_hub*"]
exclude = ["tests*", "config*", "docs*", "var*", "*.config*", "*.node_modules*", "**.private*", "**.secrets*", "**.credentials*"]

[tool.setuptools.package-data]
"framework.agent_runtime.pi" = ["node/*.mjs", "node/package.json", "node/package-lock.json"]
"infra.platform_migrations" = ["versions/*.py", "versions/*.sql"]
"interfaces.http" = ["console/*.html", "console/*.css", "console/*.js", "console/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "live_llm: tests that call an external OpenAI-compatible Chat Completions endpoint",
  "database: tests requiring explicit --sit-config and disposable database schemas",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = ["domain", "framework", "infra", "interfaces", "orchestration", "capability_hub"]

[tool.coverage.report]
show_missing = true
skip_covered = true
